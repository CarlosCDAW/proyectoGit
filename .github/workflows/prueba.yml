name: Validar Tokens
on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN contra LOCAL_DEV_TOKEN
        env:
          SECRET_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:SECRET_DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "¡Éxito! Los tokens coinciden."
          } else {
            Write-Host "Error: Los tokens NO coinciden."
            exit 1
          }